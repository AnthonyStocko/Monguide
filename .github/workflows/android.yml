# Application Android : APK de débogage construit sans Android Studio.
#
# Secrets GitHub nécessaires (Settings > Secrets and variables > Actions) :
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY : URL du projet Supabase et sa clé
#   publique, lues au moment du build web. Aucune autre clé dans l'application.
#
# Le dossier android/ est versionné (créé une seule fois par `npx cap add android`) :
# ce workflow ne fait jamais `cap add`, seulement `cap sync`.
#
# Version release signée (Play Store), à ajouter le moment venu :
#   1. Créer une clé une fois, en local :
#        keytool -genkeypair -v -keystore monguide-release.jks -alias monguide \
#          -keyalg RSA -keysize 4096 -validity 10000
#      Conserver le fichier et les mots de passe hors du dépôt (gestionnaire de mots de passe).
#   2. Créer les secrets : ANDROID_KEYSTORE_BASE64 (sortie de `base64 -w0 monguide-release.jks`),
#      ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
#   3. Dans android/app/build.gradle, ajouter une signingConfigs.release lisant
#      System.getenv("ANDROID_KEYSTORE_PATH"), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
#      et ANDROID_KEY_PASSWORD, et l'utiliser dans buildTypes.release.
#   4. Ajouter ici une étape qui décode le keystore :
#        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
#      puis lance `./gradlew bundleRelease` (AAB pour le Play Store) avec
#      ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks et les autres secrets en variables
#      d'environnement, et publie app/build/outputs/bundle/release/app-release.aab.
#   5. Avant la première publication : vérifier et fixer définitivement l'appId
#      (capacitor.config.json, "com.monguide.app") : il ne pourra plus changer.

name: Application Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - 'supabase/functions/_shared/domain/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Vérifier la présence du dossier android/
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/app/build.gradle ]; then
            echo "::error::Le dossier android/ est absent du dépôt. Le créer une seule fois en local : npm run build puis npx cap add android, et versionner android/ dans Git."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Capacitor 8 et le plugin Android Gradle 8.13 demandent le JDK 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets GitHub VITE_SUPABASE_URL et VITE_SUPABASE_ANON_KEY manquants (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          npm run build

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Construire l'APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Manifeste fusionné : récepteur de redémarrage des rappels présent, jamais USE_EXACT_ALARM.
      - name: Vérifier les permissions du manifeste fusionné
        working-directory: android
        run: |
          manifest=$(find app/build/intermediates -path '*merged_manifest*' -path '*debug*' -name AndroidManifest.xml | head -1)
          echo "Manifeste fusionné : $manifest"
          grep -o 'android.permission.[A-Z_]*' "$manifest" | sort -u
          grep -q 'LocalNotificationRestoreReceiver' "$manifest" || { echo "::error::Récepteur LocalNotificationRestoreReceiver absent"; exit 1; }
          grep -q 'android.intent.action.BOOT_COMPLETED' "$manifest" || { echo "::error::BOOT_COMPLETED absent"; exit 1; }
          grep -q 'android.permission.SCHEDULE_EXACT_ALARM' "$manifest" || { echo "::error::SCHEDULE_EXACT_ALARM absente"; exit 1; }
          if grep -q 'android.permission.USE_EXACT_ALARM' "$manifest"; then echo "::error::USE_EXACT_ALARM ne doit jamais être déclarée"; exit 1; fi

      - name: Publier l'APK
        uses: actions/upload-artifact@v7
        with:
          name: mon-guide-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
