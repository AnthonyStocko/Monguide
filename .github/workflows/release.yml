# Release Google Play : Android App Bundle (.aab) signé, déclenché par un tag Git "v*"
# (ex. git tag v1.0.0 && git push origin v1.0.0).
#
# - versionName = tag sans le "v" (x.y.z), aussi affichée dans l'application et
#   envoyée au serveur (en-tête x-monguide-app) ;
# - versionCode = numéro d'exécution de ce workflow : il augmente à chaque release,
#   comme l'exige Google Play.
#
# Secrets GitHub (Settings > Secrets and variables > Actions) :
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY : URL et clé publique Supabase ;
#   ANDROID_KEYSTORE_BASE64 : keystore d'upload encodé en base64 (base64 -w0 upload-keystore.jks) ;
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# Le keystore n'est jamais versionné : il est décodé dans un dossier temporaire du
# runner, puis effacé. Sauvegarder le keystore et ses mots de passe HORS de GitHub
# (voir README, « Publication sur Google Play »).

name: Release Google Play

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Version depuis le tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag « $tag » invalide : attendu vX.Y.Z (ex. v1.0.0)."
            exit 1
          fi
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "versionName ${tag#v}, versionCode ${{ github.run_number }}"

      - name: Vérifier la présence du dossier android/
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/app/build.gradle ]; then
            echo "::error::Le dossier android/ est absent du dépôt (créé une fois par npx cap add android, puis versionné)."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          MONGUIDE_VERSION: ${{ steps.version.outputs.name }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets VITE_SUPABASE_URL et VITE_SUPABASE_ANON_KEY manquants."
            exit 1
          fi
          npm run build

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Keystore d'upload (depuis les secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secrets du keystore manquants (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          # Lu par android/app/build.gradle ; fichier exclu de Git (android/.gitignore).
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Construire l'App Bundle et l'APK release (minifiés, signés)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -PmonguideVersionCode=${{ steps.version.outputs.code }} \
            -PmonguideVersionName=${{ steps.version.outputs.name }}

      - name: Vérifier la signature
        working-directory: android/app/build/outputs
        run: |
          keytool -printcert -jarfile bundle/release/app-release.aab | head -5
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs apk/release/app-release.apk | head -3
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$aapt2" dump badging apk/release/app-release.apk | head -1

      - name: Effacer le keystore du runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" android/keystore.properties

      - name: Renommer
        run: |
          mkdir -p release
          cp android/app/build/outputs/bundle/release/app-release.aab "release/mon-guide-${{ steps.version.outputs.name }}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "release/mon-guide-${{ steps.version.outputs.name }}-release.apk"

      # .aab : à téléverser dans la Play Console ; APK release : pour tester la version
      # minifiée sur un téléphone avant publication.
      - name: Publier l'App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: mon-guide-${{ steps.version.outputs.name }}-aab
          path: release/mon-guide-${{ steps.version.outputs.name }}.aab
          if-no-files-found: error
          retention-days: 90

      - name: Publier l'APK release (test)
        uses: actions/upload-artifact@v7
        with:
          name: mon-guide-${{ steps.version.outputs.name }}-release-apk
          path: release/mon-guide-${{ steps.version.outputs.name }}-release.apk
          if-no-files-found: error
          retention-days: 90
