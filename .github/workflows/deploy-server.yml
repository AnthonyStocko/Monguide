name: Déploiement du serveur

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/quality/**'
  workflow_dispatch:

# Un seul déploiement à la fois ; le plus récent l'emporte.
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  # Tests SQL (pgTAP, supabase/tests/database) sur une base Supabase locale
  # où toutes les migrations sont appliquées : sécurité des séjours partagés.
  # Le déploiement n'a lieu que s'ils passent.
  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installation
        run: npm ci

      # Base, authentification, stockage et API seulement (les migrations utilisent auth et storage).
      - name: Base Supabase locale
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,postgres-meta,supavisor,realtime

      - name: Tests SQL
        run: npx supabase test db

  deploy:
    needs: db-tests
    runs-on: ubuntu-latest
    env:
      # La clé service_role n'est jamais ici : Supabase la fournit aux fonctions.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installation
        run: npm ci

      - name: Tests du domaine partagé et des modules serveur
        # Séjours de référence (scripts/quality/reference.test.js) : échoue si un critère se dégrade.
        run: npx vitest run supabase/functions/_shared scripts/quality

      - name: Liaison au projet Supabase
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Migrations
        run: npx supabase db push --password "$SUPABASE_DB_PASSWORD"

      # --use-api : empaquetage par l'API Supabase, sans Docker.
      - name: Déploiement des fonctions
        run: npx supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
