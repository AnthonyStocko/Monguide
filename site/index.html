<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon guide</title>
  <meta name="description" content="Mon guide : guide touristique sur-mesure pour la France et l'Europe, sur Android, iPhone et ordinateur.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header><span class="brand"><picture><source srcset="assets/logo-dark.svg" media="(prefers-color-scheme: dark)"><img src="assets/logo.svg" alt="Mon guide" width="161" height="40"></picture></span></header>
  <main>
    <h1>Mon guide</h1>
    <p>Guide touristique sur-mesure pour la France et l'Europe, sur Android, iPhone et ordinateur.</p>
    <p class="actions">
      <a class="button" href="https://play.google.com/store/apps/details?id=com.monguide.app">Google Play</a>
      <!-- Adresse de la version web : config.js (généré au déploiement, variable WEB_APP_URL). Masqué tant qu'elle manque. -->
      <a class="button secondary" id="web-app" hidden>Utiliser sur iPhone et ordinateur</a>
    </p>
    <section>
      <h2>Français</h2>
      <ul>
        <li><a href="fr/confidentialite.html">Politique de confidentialité</a></li>
        <li><a href="fr/suppression-compte.html">Supprimer mon compte</a></li>
      </ul>
    </section>
    <section lang="en">
      <h2>English</h2>
      <ul>
        <li><a href="en/privacy.html">Privacy policy</a></li>
        <li><a href="en/delete-account.html">Delete my account</a></li>
      </ul>
    </section>
  </main>
  <script type="module">
    import { MONGUIDE } from './config.js';
    const link = document.getElementById('web-app');
    if (MONGUIDE.webAppUrl) {
      link.href = MONGUIDE.webAppUrl;
      link.hidden = false;
    }
  </script>
</body>
</html>
